        pill: "Mobilità Completa"
        title: "I Nostri Servizi"
        sub: "Soluzioni di trasporto fluide, sicure e su misura in tutta la Tunisia."
        rental_title: Tour
        rental_desc: "Parti alla scoperta dei paesaggi più belli della Tunisia. Approfitta di tour personalizzati e confortevoli, pensati per i tuoi desideri, ed esplora ogni destinazione in tutta tranquillità."
        btn_view_cars: "Vedi Auto"
        transfer_title: "Trasferimenti Privati"
        transfer_desc: "Viaggia in tutta tranquillità grazie ai nostri trasferimenti privati da e verso gli aeroporti. Un servizio puntuale e confortevole, pensato per le tue esigenze, per un viaggio senza stress."
        btn_view_transfers: "Vedi Trasferimenti"
        excursions_title: "Escursioni"
        excursions_desc: "Scopri la ricchezza della Tunisia attraverso le nostre escursioni indimenticabili. Esplora i luoghi imperdibili, vivi esperienze autentiche e goditi ogni momento."
        btn_view_excursions: "Vedi Tour"
        badge_circuits: "Con o senza guida"
        badge_transfer: "Accoglienza VIP Aeroporti"
        badge_excursions: "Con o senza guida"
    why:
        pill: "Eccellenza & Affidabilità"
        title: "Perché Sceglierci?"
        rating: "Valutazione 4.9/5 da oltre 2.400 viaggiatori"
        recommended: "Raccomandato dal 98,4% dei nostri clienti internazionali nel 2026"
        item2_title: "Autisti Puntuali e Cortesi"
        item2_desc: "Un autista professionista vi aspetterà all'aeroporto con un cartello recante il vostro nome per accogliervi non appena arrivate."
        item3_title: "Tour in Tutta la Tunisia"
        item3_desc: "Scoprite la Tunisia attraverso i nostri tour attentamente pianificati o create la vostra esperienza con un'escursione personalizzata in base ai vostri desideri."
        item4_title: "Prenotazione Facile e Trasparente"
        item4_desc: "Conferma immediata, nessun costo a sorpresa all'arrivo e pagamento sicuro in contanti in loco."
    fleet:
        pill: "Flotta 2026"
        title: "Auto a Noleggio Popolari"
        subtitle: "Dalle utilitarie efficienti ai SUV 4x4 costruiti per viaggi panoramici e percorsi nel deserto."
    transfers:
        pill: "Prezzi Fissi e Trasparenti"
        title: "Trasferimenti Aeroportuali Popolari"
        sub: "Tariffe fisse garantite con tutti i pedaggi autostradali inclusi. Nessun costo extra o commissione per ritardi dei voli."
    excursions:
        pill: "Gite Giornaliere Private"
        title: "Esplora la Tunisia"
        sub: "Circuiti di un'intera giornata e spedizioni nel deserto su misura con partenza direttamente dal tuo hotel."
        btn_view_all: "Vedi tutte le escursioni e i circuiti tematici"
    how:
        pill: "Facile e Veloce"
        title: "Come Funziona"
        sub: "La tua prenotazione confermata in 3 semplici passaggi senza scartoffie complicate."
        step1_title: "1. Scegli il tuo Servizio"
        step1_desc: "Scegli tra noleggio auto affidabile, rapido trasferimento aeroportuale o visite guidate private."
        step2_title: "2. Prenota Online"
        step2_desc: "Scegli le date, il punto di ritiro e gli extra gratuiti. Ricevi conferma immediata tramite WhatsApp ed e-mail."
        step3_title: "3. Goditi il Soggiorno"
        step3_desc: "Il tuo autista ti accoglie all'arrivo o le chiavi vengono consegnate in meno di 5 minuti. Ci occupiamo noi di tutto."
    dest:
        pill: "Copertura Nazionale"
        title: "Destinazioni Principali"
        sub: "Sedi permanenti e autisti di stanza in tutti i principali centri d'affari e località costiere."
    reviews:
        title: "Cosa Dicono i Nostri Ospiti"
        sub: "Recensioni verificate da turisti e viaggiatori internazionali."
    cta:
        title: "Pronto a Esplorare la Tunisia?"
        sub: "Prenota la tua auto a noleggio, la corsa privata o la gita di un giorno in pochi secondi. Cancellazione gratuita fino a 24 ore prima."
