        title: 'Nuestros Servicios'
        sub: 'Soluciones de transporte fluidas, seguras y a medida en todo Túnez.'
        rental_title: Circuitos
        rental_desc: 'Alquila un vehículo limpio y moderno para visitar Túnez con total libertad. Flota reciente, kilometraje ilimitado, aire acondicionado y asistencia 24/7.'
        btn_view_cars: 'Ver Coches'
        transfer_title: 'Traslados Privados'
        transfer_desc: 'Disfruta de viajes cómodos entre aeropuertos, centros turísticos y ciudades históricas. Chóferes profesionales puntuales con seguimiento de vuelos en tiempo real.'
        btn_view_transfers: 'Ver Traslados'
        excursions_title: 'Excursiones a Medida'
        excursions_desc: 'Vive los lugares emblemáticos de Túnez: dunas del Sahara, anfiteatro romano de El Jem, oasis de montaña y pueblos costeros blancos.'
        btn_view_excursions: 'Ver Excursiones'
    why:
        title: '¿Por qué Elegirnos?'
        item1_title: 'Vehículos Modernos y Limpios'
        item1_desc: 'Flota de menos de 2 años, inspeccionada y desinfectada después de cada reserva.'
        item2_title: 'Chóferes Puntuales y Corteses'
        item2_desc: 'Encuentro personalizado con cartel nominal justo a la salida de aduanas. Conductores que hablan inglés y francés.'
        item3_title: 'Tours por Todo Túnez'
        item3_desc: 'Guías turísticos certificados, furgonetas espaciosas con aire acondicionado y rutas flexibles a medida.'
        item4_title: 'Reserva Fácil y Transparente'
        item4_desc: 'Confirmación instantánea, sin sorpresas al llegar y opciones de pago seguras.'
        btn_learn_fleet: 'Conoce más sobre nuestra flota'
    fleet:
        pill: 'Flota 2026'
        title: 'Coches de Alquiler Populares'
        subtitle: 'Desde eficientes compactos hasta SUV 4x4 construidos para viajes panorámicos y rutas por el desierto.'
    transfers:
        pill: 'Precios Fijos y Transparentes'
        title: 'Traslados Aeroportuarios Populares'
        sub: 'Tarifas fijas garantizadas con todos los peajes incluidos. Sin cargos ocultos ni tarifas por retrasos en los vuelos.'
    excursions:
        pill: 'Viajes de un Día Privados'
        title: 'Explora Túnez'
        sub: 'Circuitos de día completo y expediciones al desierto a medida saliendo directamente desde tu hotel.'
    how:
        pill: 'Fácil y Rápido'
        title: 'Cómo Funciona'
        sub: 'Tu reserva confirmada en 3 sencillos pasos sin papeleo complicado.'
        step1_title: '1. Elige tu Servicio'
        step1_desc: 'Selecciona entre un alquiler de coches fiable, un traslado rápido al aeropuerto o excursiones privadas guiadas.'
        step2_title: '2. Reserva Online'
        step2_desc: 'Elige las fechas, lugar de recogida y extras gratuitos. Recibe confirmación instantánea por WhatsApp y email.'
        step3_title: '3. Disfruta tu Estancia'
        step3_desc: 'Tu chófer te recibe al llegar o las llaves se entregan en menos de 5 minutos. Nosotros nos ocupamos de todo.'
    dest:
        pill: 'Cobertura Nacional'
        title: 'Destinos Principales'
        sub: 'Sedes permanentes y conductores estacionados en todos los principales centros de negocios y zonas costeras.'
    reviews:
